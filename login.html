<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirish | MenStyle</title>
  <style>
    body { font-family: Arial; background: #f6f7fb; margin: 0; padding: 20px; }
    .box { max-width: 420px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    h2 { margin: 0; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 8px; outline: none; box-sizing: border-box; }
    input:focus { border-color: #111; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #111; color: #fff; margin-top: 14px; cursor: pointer; font-size: 15px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-gray { background: #eee; color: #111; }
    .muted { opacity: .75; font-size: 13px; margin-top: 10px; }
    a { color: #111; font-weight: 700; text-decoration: none; }
    .err { color: #e53935; font-size: 13px; margin-top: 8px; padding: 8px 12px; background: #ffecec; border-radius: 8px; display: none; }
    .suc { color: #1b7a3e; font-size: 13px; margin-top: 8px; padding: 8px 12px; background: #e8fff0; border-radius: 8px; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
<div class="box">
  <h2>Kirish</h2>
  <div class="muted">Telefon raqamingizni kiriting — SMS kod yuboriladi.</div>

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <label>Telefon raqam</label>
    <input id="phone" placeholder="+998901234567" inputmode="tel" maxlength="13" />
    <div class="err" id="err1"></div>
    <div id="recaptcha-container" style="margin-top:14px;"></div>
    <button id="sendBtn">📱 Kod yuborish</button>
    <div class="muted">Yangi foydalanuvchimisiz? <a href="register.html">Ro'yxatdan o'tish</a></div>
    <div class="muted"><a href="index.html">⬅️ Bosh sahifa</a></div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="suc">✅ SMS yuborildi! Telefoningizni tekshiring.</div>
    <label>SMS kod</label>
    <input id="otp" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
    <div class="err" id="err2"></div>
    <button id="verifyBtn">✅ Tasdiqlash</button>
    <button class="btn-gray" id="backBtn" style="margin-top:8px;">⬅️ Orqaga</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5_2wx4pNKm_R0qYVHM4zBcfehKQsqiLw",
    authDomain: "menstyle-cb582.firebaseapp.com",
    projectId: "menstyle-cb582",
    storageBucket: "menstyle-cb582.firebasestorage.app",
    messagingSenderId: "603435098673",
    appId: "1:603435098673:web:74b644b41f322129bd2b10"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  auth.languageCode = "uz";

  if (localStorage.getItem("login") === "true") location.href = "index.html";

  let confirmationResult = null;

  const phoneEl = document.getElementById("phone");
  phoneEl.addEventListener("input", () => {
    phoneEl.value = phoneEl.value.replace(/[^\d+]/g,"").slice(0,13);
  });

  function showErr(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display="block"; }
  function hideErr(id) { document.getElementById(id).style.display="none"; }

  const recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal", callback: () => {}
  });
  recaptchaVerifier.render();

  // STEP 1
  document.getElementById("sendBtn").addEventListener("click", async () => {
    hideErr("err1");
    const tel = phoneEl.value.trim();
    if (!/^\+998\d{9}$/.test(tel)) return showErr("err1", "Telefon +998XXXXXXXXX formatda kiriting");

    const users = JSON.parse(localStorage.getItem("users") || "{}");
    if (!users[tel]) return showErr("err1", "Bu raqam ro'yxatdan o'tmagan. Avval ro'yxatdan o'ting.");

    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.textContent = "Yuborilmoqda...";

    try {
      confirmationResult = await signInWithPhoneNumber(auth, tel, recaptchaVerifier);
      localStorage.setItem("lastPhone", tel);
      document.getElementById("step1").classList.remove("active");
      document.getElementById("step2").classList.add("active");
      document.getElementById("otp").focus();
    } catch(e) {
      showErr("err1", "SMS xatolik: " + e.message);
      btn.disabled = false;
      btn.textContent = "📱 Kod yuborish";
    }
  });

  // STEP 2
  document.getElementById("verifyBtn").addEventListener("click", async () => {
    hideErr("err2");
    const code = document.getElementById("otp").value.trim();
    if (code.length !== 6) return showErr("err2", "Kod 6 xonali bo'lsin");
    if (!confirmationResult) return showErr("err2", "Avval kod yuboring!");

    const btn = document.getElementById("verifyBtn");
    btn.disabled = true;
    btn.textContent = "Tekshirilmoqda...";

    try {
      await confirmationResult.confirm(code);
      localStorage.setItem("login", "true");
      localStorage.setItem("userPhone", localStorage.getItem("lastPhone"));
      location.href = "index.html";
    } catch(e) {
      showErr("err2", "Kod noto'g'ri! Qaytadan urinib ko'ring.");
      btn.disabled = false;
      btn.textContent = "✅ Tasdiqlash";
      document.getElementById("otp").value = "";
    }
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("step2").classList.remove("active");
    document.getElementById("step1").classList.add("active");
    confirmationResult = null;
  });

  document.getElementById("otp").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("verifyBtn").click();
  });
</script>
</body>
</html>
