<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ro'yxatdan o'tish | MenStyle</title>
  <style>
    body { font-family: Arial; background: #f6f7fb; margin: 0; padding: 20px; }
    .box { max-width: 460px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    h2 { margin: 0; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 8px; outline: none; background: #fff; box-sizing: border-box; }
    input:focus { border-color: #111; }
    .dob-row { display: flex; gap: 8px; margin-top: 8px; }
    .dob-row input { margin-top: 0; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #111; color: #fff; margin-top: 16px; cursor: pointer; font-size: 15px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-gray { background: #eee; color: #111; }
    .muted { opacity: .75; font-size: 13px; margin-top: 10px; }
    a { color: #111; font-weight: 700; text-decoration: none; }
    .err { color: #e53935; font-size: 13px; margin-top: 8px; padding: 8px 12px; background: #ffecec; border-radius: 8px; display: none; }
    .suc { color: #1b7a3e; font-size: 13px; margin-top: 8px; padding: 8px 12px; background: #e8fff0; border-radius: 8px; display: none; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
<div class="box">
  <h2>Ro'yxatdan o'tish</h2>
  <div class="muted">Ma'lumotlarni kiriting, SMS kod orqali tasdiqlaysiz.</div>

  <!-- STEP 1: Ma'lumotlar -->
  <div class="step active" id="step1">
    <label>Ism</label>
    <input id="firstName" placeholder="Axrorbek" maxlength="50" />

    <label>Familya</label>
    <input id="lastName" placeholder="Qosimov" maxlength="50" />

    <label>Tug'ilgan sana</label>
    <div class="dob-row">
      <input id="dd"   inputmode="numeric" placeholder="Kun" maxlength="2" style="flex:1;" />
      <input id="mm"   inputmode="numeric" placeholder="Oy"  maxlength="2" style="flex:1;" />
      <input id="yyyy" inputmode="numeric" placeholder="Yil" maxlength="4" style="flex:2;" />
    </div>

    <label>Telefon raqam</label>
    <input id="phone" placeholder="+998901234567" inputmode="tel" maxlength="13" />

    <div class="err" id="err1"></div>
    <div id="recaptcha-container" style="margin-top:14px;"></div>
    <button id="sendBtn">📱 Kod yuborish</button>

    <div class="muted">Akkauntingiz bormi? <a href="login.html">Kirish</a></div>
    <div class="muted"><a href="index.html">⬅️ Bosh sahifa</a></div>
  </div>

  <!-- STEP 2: SMS kod -->
  <div class="step" id="step2">
    <div class="suc" id="sucMsg" style="display:block;">✅ SMS yuborildi! Telefoningizni tekshiring.</div>

    <label>SMS kod</label>
    <input id="otp" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />

    <div class="err" id="err2"></div>
    <button id="verifyBtn">✅ Tasdiqlash</button>
    <button class="btn-gray" id="backBtn" style="margin-top:8px;">⬅️ Orqaga</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5_2wx4pNKm_R0qYVHM4zBcfehKQsqiLw",
    authDomain: "menstyle-cb582.firebaseapp.com",
    projectId: "menstyle-cb582",
    storageBucket: "menstyle-cb582.firebasestorage.app",
    messagingSenderId: "603435098673",
    appId: "1:603435098673:web:74b644b41f322129bd2b10"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  auth.languageCode = "uz";

  let confirmationResult = null;

  // Input helpers
  const dd = document.getElementById("dd");
  const mm = document.getElementById("mm");
  const yyyy = document.getElementById("yyyy");
  const phoneEl = document.getElementById("phone");

  dd.addEventListener("input", () => { dd.value = dd.value.replace(/\D/g,"").slice(0,2); if(dd.value.length===2) mm.focus(); });
  mm.addEventListener("input", () => { let v=mm.value.replace(/\D/g,"").slice(0,2); if(Number(v)>12) v="12"; mm.value=v; if(mm.value.length===2) yyyy.focus(); });
  yyyy.addEventListener("input", () => { yyyy.value = yyyy.value.replace(/\D/g,"").slice(0,4); });
  phoneEl.addEventListener("input", () => { phoneEl.value = phoneEl.value.replace(/[^\d+]/g,"").slice(0,13); });

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = "block";
  }
  function hideErr(id) { document.getElementById(id).style.display = "none"; }

  // reCAPTCHA
  const recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal", callback: () => {}
  });
  recaptchaVerifier.render();

  // STEP 1 — Kod yuborish
  document.getElementById("sendBtn").addEventListener("click", async () => {
    hideErr("err1");
    const fn  = document.getElementById("firstName").value.trim();
    const ln  = document.getElementById("lastName").value.trim();
    const d   = dd.value.trim();
    const mo  = mm.value.trim();
    const yr  = yyyy.value.trim();
    const tel = phoneEl.value.trim();

    if (!fn) return showErr("err1", "Ismni kiriting");
    if (!ln) return showErr("err1", "Familyani kiriting");
    if (!d || !mo || !yr) return showErr("err1", "Tug'ilgan sanani to'liq kiriting");
    if (!/^\+998\d{9}$/.test(tel)) return showErr("err1", "Telefon +998XXXXXXXXX formatda kiriting");

    const users = JSON.parse(localStorage.getItem("users") || "{}");
    if (users[tel]) {
      showErr("err1", "Bu raqam allaqachon ro'yxatdan o'tgan!");
      setTimeout(() => location.href = "login.html", 1500);
      return;
    }

    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.textContent = "Yuborilmoqda...";

    try {
      confirmationResult = await signInWithPhoneNumber(auth, tel, recaptchaVerifier);

      // Pending profile saqlash
      localStorage.setItem("pendingProfile", JSON.stringify({
        phone: tel, firstName: fn, lastName: ln,
        dob: `${String(d).padStart(2,"0")}.${String(mo).padStart(2,"0")}.${yr}`,
        createdAt: Date.now()
      }));
      localStorage.setItem("lastPhone", tel);

      // Step 2 ga o'tish
      document.getElementById("step1").classList.remove("active");
      document.getElementById("step2").classList.add("active");
      document.getElementById("otp").focus();

    } catch(e) {
      showErr("err1", "SMS xatolik: " + e.message);
      btn.disabled = false;
      btn.textContent = "📱 Kod yuborish";
    }
  });

  // STEP 2 — Tasdiqlash
  document.getElementById("verifyBtn").addEventListener("click", async () => {
    hideErr("err2");
    const code = document.getElementById("otp").value.trim();
    if (code.length !== 6) return showErr("err2", "Kod 6 xonali bo'lsin");
    if (!confirmationResult) return showErr("err2", "Avval kod yuboring!");

    const btn = document.getElementById("verifyBtn");
    btn.disabled = true;
    btn.textContent = "Tekshirilmoqda...";

    try {
      const userCredential = await confirmationResult.confirm(code);
      const uid = userCredential.user.uid;

      // Profil saqlash
      let pending;
      try { pending = JSON.parse(localStorage.getItem("pendingProfile")); } catch {}
      if (pending && pending.phone) {
        const users = JSON.parse(localStorage.getItem("users") || "{}");
        users[pending.phone] = { ...pending, role: "user", uid };
        localStorage.setItem("users", JSON.stringify(users));
        localStorage.removeItem("pendingProfile");
      }

      localStorage.setItem("login", "true");
      localStorage.setItem("userPhone", localStorage.getItem("lastPhone"));
      location.href = "index.html";

    } catch(e) {
      showErr("err2", "Kod noto'g'ri! Qaytadan urinib ko'ring.");
      btn.disabled = false;
      btn.textContent = "✅ Tasdiqlash";
      document.getElementById("otp").value = "";
      document.getElementById("otp").focus();
    }
  });

  // Orqaga
  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("step2").classList.remove("active");
    document.getElementById("step1").classList.add("active");
    confirmationResult = null;
  });

  document.getElementById("otp").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("verifyBtn").click();
  });
</script>
</body>
</html>
