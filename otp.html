<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kodni tasdiqlash | MenStyle</title>
  <style>
    body { font-family: Arial; background: #f6f7fb; margin: 0; padding: 20px; }
    .box { max-width: 420px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    h2 { margin: 0; }
    .muted { opacity: .75; font-size: 13px; margin-top: 8px; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 8px; outline: none; box-sizing: border-box; }
    input[readonly] { background: #f3f4f6; }
    input:focus:not([readonly]) { border-color: #111; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #111; color: #fff; margin-top: 12px; cursor: pointer; font-size: 15px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; margin-top: 10px; }
    .row button { background: #eee; color: #111; flex: 1; margin-top: 0; }
    .err { color: #e53935; font-size: 13px; margin-top: 8px; display: none; padding: 8px 12px; background: #ffecec; border-radius: 8px; }
  </style>
</head>
<body>
<div class="box">
  <h2>SMS kodni kiriting</h2>
  <div class="muted">Telefoningizga kelgan 6 xonali kodni yozing.</div>

  <label>Telefon</label>
  <input id="phoneEl" readonly />

  <label>SMS kod</label>
  <input id="otp" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
  <div class="err" id="errMsg"></div>

  <button id="verifyBtn">✅ Tasdiqlash</button>
  <div class="row">
    <button id="backBtn">⬅️ Orqaga</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5_2wx4pNKm_R0qYVHM4zBcfehKQsqiLw",
    authDomain: "menstyle-cb582.firebaseapp.com",
    projectId: "menstyle-cb582",
    storageBucket: "menstyle-cb582.firebasestorage.app",
    messagingSenderId: "603435098673",
    appId: "1:603435098673:web:74b644b41f322129bd2b10"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const lastPhone = localStorage.getItem("lastPhone") || "";
  const otpMode   = localStorage.getItem("otpMode") || "login";

  if (!lastPhone) { location.href = "login.html"; }

  document.getElementById("phoneEl").value = lastPhone;

  const otpEl     = document.getElementById("otp");
  const verifyBtn = document.getElementById("verifyBtn");
  const errMsg    = document.getElementById("errMsg");
  const backBtn   = document.getElementById("backBtn");

  function showErr(msg) { errMsg.textContent = msg; errMsg.style.display = "block"; }
  function hideErr()    { errMsg.style.display = "none"; }

  otpEl.addEventListener("input", () => {
    otpEl.value = otpEl.value.replace(/\D+/g, "").slice(0, 6);
    hideErr();
  });

  // confirmationResult ni olish — login.html dan kelgan
  const confirmationResult = window.opener?._confirmationResult || window._confirmationResult;

  verifyBtn.addEventListener("click", async () => {
    const code = otpEl.value.trim();
    if (code.length !== 6) return showErr("Kod 6 xonali bo'lsin");

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Tekshirilmoqda...";

    try {
      // window._confirmationResult login.html da saqlangan
      const cr = window._confirmationResult;
      if (!cr) {
        // Agar sahifa yangilangan bo'lsa — qayta yuborish kerak
        showErr("Sessiya tugagan. Qaytib kod so'rang.");
        verifyBtn.disabled = false;
        verifyBtn.textContent = "✅ Tasdiqlash";
        return;
      }

      const userCredential = await cr.confirm(code);
      const firebaseUser   = userCredential.user;

      if (otpMode === "register") {
        let pending;
        try { pending = JSON.parse(localStorage.getItem("pendingProfile")); } catch {}
        if (pending && pending.phone) {
          const users = JSON.parse(localStorage.getItem("users") || "{}");
          users[pending.phone] = {
            phone:     pending.phone,
            firstName: pending.firstName || "",
            lastName:  pending.lastName  || "",
            dob:       pending.dob       || "",
            createdAt: pending.createdAt || Date.now(),
            role:      "user",
            uid:       firebaseUser.uid
          };
          localStorage.setItem("users", JSON.stringify(users));
          localStorage.removeItem("pendingProfile");
        }
      }

      localStorage.setItem("login", "true");
      localStorage.setItem("userPhone", lastPhone);
      localStorage.removeItem("otpMode");
      location.href = "index.html";

    } catch(e) {
      showErr("Kod noto'g'ri yoki muddati o'tgan!");
      verifyBtn.disabled = false;
      verifyBtn.textContent = "✅ Tasdiqlash";
      otpEl.value = "";
      otpEl.focus();
    }
  });

  backBtn.addEventListener("click", () => {
    location.href = otpMode === "register" ? "register.html" : "login.html";
  });

  otpEl.addEventListener("keydown", e => { if (e.key === "Enter") verifyBtn.click(); });
  otpEl.focus();
</script>
</body>
</html>
