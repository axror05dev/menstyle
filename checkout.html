<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout | MenStyle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Arial; background: #f6f7fb; margin: 0; padding: 20px; }
    .box { max-width: 720px; margin: 30px auto; background: #fff; padding: 22px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    h2, h3 { margin: 0; }
    .muted { opacity: .75; font-size: 13px; margin-top: 8px; }
    .pay { padding: 12px; border: 1px solid #eee; border-radius: 12px; margin-top: 12px; }
    label { display: block; margin-top: 8px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-top: 8px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #111; }
    button { padding: 12px; border: 0; border-radius: 12px; background: #111; color: #fff; margin-top: 12px; cursor: pointer; width: 100%; font-size: 14px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btnGray { background: #eee; color: #111; }
    .btnRed  { background: #e53935; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .cardBox { display: none; margin-top: 10px; }
    .cartItem { display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 1px solid #eee; border-radius: 12px; padding: 10px; margin-top: 10px; }
    .left { display: flex; gap: 10px; align-items: center; }
    .pimg { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #f2f2f2; flex-shrink: 0; }
    .pname  { font-weight: 700; }
    .pprice { opacity: .75; font-size: 13px; margin-top: 4px; }
    .qtyBox { display: flex; align-items: center; gap: 6px; }
    .qtyBtn { width: auto; padding: 8px 10px; border-radius: 10px; background: #eee; color: #111; margin-top: 0; }
    .trash  { width: auto; padding: 8px 10px; border-radius: 10px; background: #ffecec; color: #b71c1c; margin-top: 0; }
    .totalLine { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; margin-top: 14px; padding-top: 12px; font-weight: 700; font-size: 16px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: #f1f3f7; }
    .hint  { font-size: 12px; opacity: .75; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Checkout</h2>
    <div class="muted">Savatni tekshiring va to'lov turini tanlang.</div>

    <h3 style="margin-top:18px;">Savat</h3>
    <div id="cartList"></div>

    <div class="row" style="margin-top:12px;">
      <button type="button" class="btnGray" id="backBtn">⬅️ Orqaga</button>
      <button type="button" class="btnRed"  id="clearBtn">🗑 Savatni tozalash</button>
    </div>

    <div class="totalLine">
      <div>Jami:</div>
      <div id="totalSum">0 so'm</div>
    </div>

    <h3 style="margin-top:20px;">To'lov turi</h3>
    <div class="pay">
      <label><input type="radio" name="pay" value="cash" checked> Naqd pul <span class="badge">pending</span></label>
      <label><input type="radio" name="pay" value="card"> Karta <span class="badge">demo</span></label>
      <label><input type="radio" name="pay" value="payme"> Payme <span class="badge">demo</span></label>
      <label><input type="radio" name="pay" value="click"> Click <span class="badge">demo</span></label>
    </div>

    <div id="cardBox" class="cardBox">
      <label>Karta turi</label>
      <select id="cardType">
        <option value="uzcard">Uzcard</option>
        <option value="humo">Humo</option>
        <option value="visa">Visa</option>
        <option value="mastercard">MasterCard</option>
      </select>
      <label>Karta raqam</label>
      <input id="cardNumber" inputmode="numeric" placeholder="8600 1234 5678 9012">
      <div class="row">
        <div style="flex:1;"><label>MM/YY</label><input id="cardExp" placeholder="12/28"></div>
        <div style="flex:1;"><label>CVV</label><input id="cardCvv" inputmode="numeric" placeholder="123"></div>
      </div>
      <div class="hint" id="cardHint">Uzcard: 8600..., Humo: 9860... (demo)</div>
    </div>

    <button type="button" id="orderBtn">Buyurtma berish</button>
    <div class="muted" id="noteBox">Naqd: buyurtma 'pending' bo'ladi.</div>
  </div>

  <script src="auth.js"></script>
  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    window._db = db;
    window._addDoc = addDoc;
    window._collection = collection;
  </script>
  <script type="module" src="script.js"></script>
  <script>
    // Login tekshirish
    if (localStorage.getItem("login") !== "true") {
      location.href = "login.html";
    }

    const cartList   = document.getElementById("cartList");
    const totalSumEl = document.getElementById("totalSum");
    const cardBox    = document.getElementById("cardBox");
    const noteBox    = document.getElementById("noteBox");
    const orderBtn   = document.getElementById("orderBtn");
    const backBtn    = document.getElementById("backBtn");
    const clearBtn   = document.getElementById("clearBtn");
    const cardTypeEl = document.getElementById("cardType");
    const cardNumEl  = document.getElementById("cardNumber");
    const cardExpEl  = document.getElementById("cardExp");
    const cardCvvEl  = document.getElementById("cardCvv");
    const cardHintEl = document.getElementById("cardHint");

    function money(n) { return Number(n||0).toLocaleString("uz-UZ") + " so'm"; }

    function genOrderNo() {
      const d = new Date();
      const pad = v => String(v).padStart(2,"0");
      return `MS-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.floor(100000+Math.random()*900000)}`;
    }
    function genCustomerId() {
      const d = new Date();
      const pad = v => String(v).padStart(2,"0");
      return `U-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.floor(100000+Math.random()*900000)}`;
    }

    function validateCard() {
      const type = cardTypeEl.value;
      const num  = cardNumEl.value.replace(/\D/g,"");
      const exp  = cardExpEl.value.trim();
      const cvv  = cardCvvEl.value.replace(/\D/g,"");

      if (num.length !== 16) return "Karta raqami 16 ta raqam bo'lsin";
      if (type==="uzcard"    && !num.startsWith("8600")) return "Uzcard 8600 bilan boshlanadi";
      if (type==="humo"      && !num.startsWith("9860")) return "Humo 9860 bilan boshlanadi";
      if (type==="visa"      && !num.startsWith("4"))    return "Visa 4 bilan boshlanadi";
      if (type==="mastercard") {
        const f2=Number(num.slice(0,2)), f4=Number(num.slice(0,4));
        if (!((f2>=51&&f2<=55)||(f4>=2221&&f4<=2720))) return "MasterCard 51-55 yoki 2221-2720 bilan boshlanadi";
      }
      if (!/^\d{2}\/\d{2}$/.test(exp)) return "MM/YY formatda kiriting (12/28)";
      if (Number(exp.slice(0,2))<1||Number(exp.slice(0,2))>12) return "Oy 01-12 orasida bo'lsin";
      if (cvv.length<3||cvv.length>4) return "CVV 3-4 ta raqam bo'lsin";
      return null;
    }

    function getOrCreateCustomerId(phone) {
      const users = safeParse("users", {});
      const p = String(phone||"").trim();
      if (!p) return { customerId:"U-UNKNOWN", users };
      const u = users[p] || { phone:p, createdAt:Date.now(), role:"user" };
      if (!u.userId) u.userId = genCustomerId();
      users[p] = u;
      saveLocal("users", users);
      return { customerId: u.userId, users };
    }

    function renderCart() {
      const items = getCartDetailed();
      const total = getCartTotal();
      totalSumEl.textContent = money(total);

      if (!items.length) {
        cartList.innerHTML = `<div class="muted" style="padding:20px 0; text-align:center;">Savat bo'sh 😅</div>`;
        orderBtn.disabled = true;
        return;
      }
      orderBtn.disabled = false;

      cartList.innerHTML = items.map(it => {
        const safeImg = /^(https?:\/\/|data:image\/)/.test(it.img) ? it.img : "";
        const imgHtml = safeImg
          ? `<img class="pimg" src="${safeImg}" alt="">`
          : `<div class="pimg" style="display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;">Rasm yo'q</div>`;

        return `
          <div class="cartItem">
            <div class="left">
              ${imgHtml}
              <div>
                <div class="pname">${escHtml(it.name)}</div>
                <div class="pprice">${money(it.price)} × ${it.qty} = ${money(it.price*it.qty)}</div>
              </div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <div class="qtyBox">
                <button type="button" class="qtyBtn" data-action="dec" data-id="${it.id}">➖</button>
                <b>${it.qty}</b>
                <button type="button" class="qtyBtn" data-action="inc" data-id="${it.id}">➕</button>
              </div>
              <button type="button" class="trash" data-action="remove" data-id="${it.id}">🗑</button>
            </div>
          </div>`;
      }).join("");
    }

    cartList.addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.dataset.action, id = Number(btn.dataset.id);
      if (action==="inc")    increaseQty(id);
      if (action==="dec")    decreaseQty(id);
      if (action==="remove") removeFromCart(id);
      renderCart();
    });

    function updateCardUI() {
      const t = cardTypeEl.value;
      const hints = { uzcard:"8600...", humo:"9860...", visa:"4xxx...", mastercard:"51-55 yoki 2221-2720..." };
      const ph    = { uzcard:"8600 1234 5678 9012", humo:"9860 1234 5678 9012", visa:"4xxx xxxx xxxx xxxx", mastercard:"5xxx xxxx xxxx xxxx" };
      cardNumEl.placeholder = ph[t] || "";
      cardHintEl.textContent = `${t.charAt(0).toUpperCase()+t.slice(1)} (demo): ${hints[t]||""}`;
    }

    function updatePayUI() {
      const val = document.querySelector('input[name="pay"]:checked').value;
      cardBox.style.display = val==="card" ? "block" : "none";
      if (val==="payme"||val==="click") noteBox.textContent = "Demo: buyurtma 'paid' bo'ladi.";
      else if (val==="card")            noteBox.textContent = "Karta to'ldirilsa buyurtma 'paid' bo'ladi.";
      else                              noteBox.textContent = "Naqd: buyurtma 'pending' bo'ladi.";
    }

    document.querySelectorAll('input[name="pay"]').forEach(r => r.addEventListener("change", updatePayUI));
    cardTypeEl.addEventListener("change", updateCardUI);
    backBtn.addEventListener("click",  () => location.href="index.html");
    clearBtn.addEventListener("click", () => { if(confirm("Savatni tozalaysizmi?")){ clearCart(); renderCart(); } });

    orderBtn.addEventListener("click", async () => {
      const items = getCartDetailed();
      if (!items.length) return alert("Savat bo'sh.");

      const pay   = document.querySelector('input[name="pay"]:checked').value;
      const total = getCartTotal();
      const phone = localStorage.getItem("userPhone") || localStorage.getItem("lastPhone") || "";
      const { customerId, users } = getOrCreateCustomerId(phone);
      const u = users[phone] || {};
      const customerName = (`${u.firstName||""} ${u.lastName||""}`).trim() || phone || "Foydalanuvchi";

      let paid=false, status="pending";
      if (pay==="cash") { paid=false; status="pending"; }
      else if (pay==="card") {
        const err = validateCard();
        if (err) return alert(err);
        paid=true; status="paid";
      } else { paid=true; status="paid"; }

      const order = {
        id: Date.now(), orderNo: genOrderNo(),
        customerId, phone, customerName, items, total,
        pay, paid, status,
        cardType: pay==="card" ? cardTypeEl.value : null,
        createdAt: Date.now()
      };

      // Firestore ga saqlash
      if (window._addDoc && window._db && window._collection) {
        try {
          const docRef = await window._addDoc(window._collection(window._db, "orders"), order);
          order.firestoreId = docRef.id;
        } catch(e) { console.error("Firestore xatosi:", e); }
      }
      saveLocal("lastOrder", order);

      clearCart();
      location.href="receipt.html";
    });

    // Init
    updatePayUI();
    updateCardUI();
    renderCart();
  </script>
</body>
</html>
